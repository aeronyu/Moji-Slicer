name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without v prefix, for example 0.1.0'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build release app
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi

          VERSION_FROM_FILE="$(tr -d '[:space:]' < VERSION)"
          if [ "$VERSION" != "$VERSION_FROM_FILE" ]; then
            echo "Requested version $VERSION does not match VERSION file $VERSION_FROM_FILE" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          xcodebuild \
            -project "Moji Slicer.xcodeproj" \
            -scheme "Moji Slicer" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_SOURCE_FILE_NAMES='CodeQualityCLI.swift CodeQualityView.swift' \
            MARKETING_VERSION='${{ steps.version.outputs.version }}' \
            CURRENT_PROJECT_VERSION='${{ github.run_number }}' \
            build

      - name: Package app
        run: |
          mkdir -p dist
          APP_PATH="build/DerivedData/Build/Products/Release/Moji Slicer.app"
          test -d "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "dist/Moji-Slicer-${{ steps.version.outputs.version }}-macOS.zip"
          shasum -a 256 "dist/Moji-Slicer-${{ steps.version.outputs.version }}-macOS.zip" > "dist/Moji-Slicer-${{ steps.version.outputs.version }}-macOS.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Moji Slicer v${{ steps.version.outputs.version }}
          body: |
            ## Moji Slicer v${{ steps.version.outputs.version }}

            Early macOS release for slicing grid images of emojis, stickers, or icons into individual PNG files.

            ### What's included

            - Import one grid image.
            - Configure rows, columns, gaps, and padding.
            - Drag and resize the slicing frame.
            - Preview slice boxes.
            - Export individual PNG files.

            ### Download

            Download `Moji-Slicer-${{ steps.version.outputs.version }}-macOS.zip`, unzip it, and move `Moji Slicer.app` to your Applications folder.

            ### macOS security note

            This build is unsigned and not notarized. macOS may show a Gatekeeper warning the first time you open it.
          files: |
            dist/Moji-Slicer-${{ steps.version.outputs.version }}-macOS.zip
            dist/Moji-Slicer-${{ steps.version.outputs.version }}-macOS.zip.sha256
          draft: false
          prerelease: true
